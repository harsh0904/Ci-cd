name: CI/CD Pipeline 🚀

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-project

jobs:
  # ─── JOB 1: Run Tests ─────────────────────────────────────────
  test:
    name: 🧪 Run Jest Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests with coverage
        run: npm run test:ci
        env:
          MONGODB_URI: mongodb://localhost:27017/taskmanager_test
          NODE_ENV: test

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

  # ─── JOB 2: Build & Push Docker Image ─────────────────────────
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test   # Only runs if tests pass
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: 🏗️ Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 3: Deploy to Kubernetes ──────────────────────────────
  deploy:
    name: ☸️ Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export KUBECONFIG=/root/.kube/config
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            echo "📦 Pulling image: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-project:${SHORT_SHA}"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-project:latest

            echo "☸️ Applying K8s manifests..."
            kubectl apply -f /var/www/cicd/k8s/namespace.yaml
            kubectl apply -f /var/www/cicd/k8s/configmap.yaml
            kubectl apply -f /var/www/cicd/k8s/secret.yaml
            kubectl apply -f /var/www/cicd/k8s/deployment.yaml
            kubectl apply -f /var/www/cicd/k8s/service.yaml
            kubectl apply -f /var/www/cicd/k8s/hpa.yaml

            echo "🔄 Rolling out new image..."
            kubectl set image deployment/taskapi-deployment \
              taskapi=${{ secrets.DOCKERHUB_USERNAME }}/cicd-project:latest \
              -n app

            echo "⏳ Waiting for rollout..."
            kubectl rollout status deployment/taskapi-deployment -n app --timeout=120s

            echo "✅ Pods running:"
            kubectl get pods -n app
            kubectl get hpa -n app

  # ─── JOB 4: Verify Deployment ─────────────────────────────────
  verify:
    name: ✅ Verify Live API
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🔍 Health check
        run: |
          sleep 10
          echo "Checking https://cicd.snenmh.xyz/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cicd.snenmh.xyz/health)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed!"
            exit 1
          fi
          echo "✅ API is healthy!"
          curl -s https://cicd.snenmh.xyz/health | python3 -m json.tool
